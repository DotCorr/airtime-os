name: Build AirtimeOS image
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs util-linux wget qemu-utils

      - name: Fetch alpine-make-vm-image
        run: |
          sudo wget -qO /usr/local/bin/alpine-make-vm-image \
            https://raw.githubusercontent.com/alpinelinux/alpine-make-vm-image/master/alpine-make-vm-image
          sudo chmod +x /usr/local/bin/alpine-make-vm-image

      - name: Build image
        run: |
          mkdir -p dist
          sudo alpine-make-vm-image \
            --image-format raw \
            --image-size 2G \
            --kernel-flavor lts \
            --branch v3.20 \
            --packages "$(cat packages.txt)" \
            --fs-skel-dir overlay \
            --fs-skel-chown root:root \
            --script-chroot \
            dist/airtimeos-x86_64.img -- ./provision.sh

      - name: Compress
        run: |
          cd dist && gzip -9 -k airtimeos-x86_64.img
          ls -la

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0 dist/airtimeos-x86_64.img.gz --clobber -R ${{ github.repository }}
