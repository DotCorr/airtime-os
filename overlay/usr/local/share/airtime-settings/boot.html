<!doctype html>
<meta charset="utf-8">
<title>Airtime</title>
<body style="margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px">
<div style="font-weight:700;font-size:1.3rem">Airtime</div>
<div id="s" data-i18n="connecting" style="color:#666;font-size:0.9rem">Connecting&hellip;</div>
<script src="/i18n.js"></script>
<script>
// Bootstrap trampoline: the kiosk opens this local page with "app|settings"
// in the hash. Retries the app until it is reachable (early navigations can
// also get dropped while the browser settles on accel-less hardware); if the
// network never comes up, falls back to the Wi-Fi settings page.
var parts = location.hash.slice(1).split("|");
var APP = decodeURIComponent(parts[0] || "") || "https://airtime.dotcorr.com/tv";
var SETTINGS = decodeURIComponent(parts[1] || "");
var fails = 0;
function go() {
  fetch(APP, { mode: "no-cors", cache: "no-store" }).then(
    function () { location.replace(APP + (APP.indexOf("?") >= 0 ? "&" : "?") + "airtimeos=1"); },
    function () {
      fails++;
      if (SETTINGS && fails >= 4) {
        document.getElementById("s").textContent =
          typeof t === "function" ? t("bootNoNetwork") : "No network — opening Wi-Fi setup…";
        location.replace(SETTINGS);
      }
    }
  );
}
setInterval(go, 2000);
setTimeout(go, 150);
// Localize the status line (and flip to RTL for Arabic). i18n.js may be
// missing on a half-updated system; the English fallback above still works.
if (typeof initI18n === "function") initI18n();
</script>
